name: Icarus
description: Icarus is an aerospace and defense company building autonomous, solar-powered
  stratospheric aircraft for persistent surveillance and connectivity. Its APOLLO platform
  operates continuously above 60,000 feet, delivering rapid aerial intelligence, wide-area
  coverage across 1,000+ square miles, and always-on, low-latency (5-10ms) direct-to-device
  communications for weeks-long missions without ground infrastructure. Founded in 2023 and
  based in El Segundo, California, Icarus was part of Y Combinator's Fall 2025 batch. The
  company operates in the defense/aerospace hardware space and does not currently publish any
  public API, developer portal, SDK, or technical developer surface; this profile captures its
  identity for the API Evangelist network.
